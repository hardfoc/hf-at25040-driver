<rect x="32" y="689.4" width="1136" height="89" rx="12" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1"/>
<rect x="32" y="697.4" width="4" height="73" rx="2" fill="#64748B"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#17202C">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">board ID, calibration constants, settings ...</text>
<rect x="48" y="323.4" width="102.2" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="56" y="341.5" font-size="16" font-weight="700" fill="#3730A3">LastRdsr()</text>
<rect x="158.2" y="323.4" width="124" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="166.2" y="341.5" font-size="16" font-weight="700" fill="#3730A3">ReadStatus()</text>
<rect x="290.2" y="323.4" width="77.9" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="298.2" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Probe()</text>
<rect x="376" y="323.4" width="70.6" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="384" y="341.5" font-size="16" font-weight="700" fill="#3730A3">Read()</text>
<rect x="454.6" y="323.4" width="130.3" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="462.6" y="341.5" font-size="16" font-weight="700" fill="#3730A3">WriteEnable()</text>
<rect x="592.9" y="323.4" width="115.9" height="26" rx="13" fill="#EEF0FF" stroke="#C7CBF8" stroke-width="1"/>
<text x="600.9" y="341.5" font-size="16" font-weight="700" fill="#3730A3">WritePage()</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">at25040::Device&lt;Spi&gt;, inc/at25040.hpp</text>
<text x="56" y="442.4" font-size="20" font-weight="700" fill="#3730A3">Communication interface</text>
<text x="56" y="473" font-size="17" fill="#2B3442">at25040::SpiInterface&lt;Derived&gt;: one full-duplex transaction per call,</text>
<text x="56" y="497.7" font-size="17" fill="#2B3442">instructions and A8 placed by the driver, bounds and page checks before the bus</text>
<text x="56" y="596.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="625.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">transfer(tx, rx, len, timeout_ms)</text>
<text x="56" y="724.4" font-size="20" font-weight="700" fill="#17202C">AT25040B</text>
<text x="56" y="755" font-size="17" fill="#2B3442">SPI mode 0 or 3, up to 5 / 10 / 20 MHz  /  CS, SO, SI, SCK, WP, HOLD</text>
<rect x="32" y="790.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="805.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="790.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="805.4" font-size="16" fill="#566070">you write</text>
<rect x="282.1" y="790.8" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="805.4" font-size="16" fill="#566070">hardware</text>
